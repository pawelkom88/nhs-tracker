name: Link Checker

on:
  schedule:
    # Run weekly on Mondays at 08:00 UTC
    - cron: '0 8 * * 1'
  pull_request:
    paths:
      - 'content/**'
      - 'data/**/reference.json'
      - '.github/workflows/links.yml'
      - 'lychee.toml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  link-checker:
    name: Link Checker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site for HTML verification
        run: pnpm --filter site build
        env:
          KYW_DATA_DIR: apps/site/test/fixtures/data

      - name: Run lychee link checker
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml --no-progress content/**/*.md docs/plan/data-sources.md apps/site/out/**/*.html
          output: ./lychee-report.md
          fail: false

      - name: Open or update issue on scheduled failure
        if: github.event_name == 'schedule' && steps.lychee.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '## Broken Links Detected\n\nWeekly link checker detected broken links in the repository:\n\n';
            try {
              body += fs.readFileSync('./lychee-report.md', 'utf8');
            } catch (err) {
              body += 'Could not read lychee report file: ' + err.message;
            }

            const title = 'Broken links detected in repository';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'broken-links',
            });

            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['broken-links'],
              });
            }

      - name: Fail if links broken
        if: steps.lychee.outputs.exit_code != '0'
        run: |
          echo "Broken links were found by lychee link checker:"
          cat ./lychee-report.md || true
          exit 1
